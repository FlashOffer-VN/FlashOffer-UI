services:
  ui:
    container_name: flashoffer-ui
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # API chạy trên host (docker compose của FlashOffer-API)
      NGINX_PROXY: "unused"
    volumes:
      - .:/app
      - ui_node_modules:/app/node_modules

volumes:
  ui_node_modules:
