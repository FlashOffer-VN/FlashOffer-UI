<svg viewBox="0 0 240 50" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon - Chữ K trắng trên nền trong suốt -->
  <g transform="translate(0, 3)">
    <rect x="2" y="2" width="38" height="38" rx="10" fill="#7C3AED" opacity="0.9"/>
    <text x="21" y="30" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="white" text-anchor="middle">
      K
    </text>
  </g>

  <!-- Kindi - Brand Name trắng -->
  <text x="48" y="32" font-family="Inter, sans-serif" font-size="22" font-weight="600" fill="white" 
        letter-spacing="-0.3">
    Kindi
  </text>

  <!-- Divider -->
  <text x="112" y="32" font-family="Inter, sans-serif" font-size="12" font-weight="300" fill="#64748B" 
        letter-spacing="1">
    |
  </text>

  <!-- Tagline xám nhạt -->
  <text x="126" y="32" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#94A3B8" 
        letter-spacing="0.3">
    Admin
  </text>
</svg>