<!-- admin-login.component.html -->
<div class="admin-login-container">
    <div class="admin-login-card">
        <!-- Header -->
        <div class="admin-login-header">
            <div class="admin-login-logo">
                <i class="fas fa-shield-alt"></i>
            </div>
            <h1>{{ 'ADMIN_LOGIN.TITLE' | translate }}</h1>
            <p>{{ 'ADMIN_LOGIN.SUBTITLE' | translate }}</p>
        </div>

        <!-- Form -->
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="admin-login-form">
            <!-- Username -->
            <app-input formControlName="username" [label]="'ADMIN_LOGIN.USERNAME' | translate"
                [placeholder]="'ADMIN_LOGIN.USERNAME_PLACEHOLDER' | translate" [required]="true"
                [isInvalid]="isFieldInvalid('username')" [errorMessage]="getErrorMessage('username')"
                icon="fas fa-user">
            </app-input>

            <!-- Password -->
            <app-input formControlName="password" [type]="showPassword ? 'text' : 'password'"
                [label]="'ADMIN_LOGIN.PASSWORD' | translate"
                [placeholder]="'ADMIN_LOGIN.PASSWORD_PLACEHOLDER' | translate" [required]="true"
                [isInvalid]="isFieldInvalid('password')" [errorMessage]="getErrorMessage('password')"
                icon="fas fa-lock">
                <button type="button" (click)="togglePasswordVisibility()" class="admin-login-password-toggle"
                    [attr.aria-label]="(showPassword ? 'Hide password' : 'Show password')">
                    <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                </button>
            </app-input>

            <!-- Options -->
            <div class="admin-login-options">
                <label class="admin-login-remember">
                    <input formControlName="rememberMe" type="checkbox">
                    <span>{{ 'ADMIN_LOGIN.REMEMBER_ME' | translate }}</span>
                </label>
                <a routerLink="/forgot-password" class="admin-login-forgot">
                    {{ 'ADMIN_LOGIN.FORGOT_PASSWORD' | translate }}
                </a>
            </div>

            <!-- Submit -->
            <app-button type="submit" [variant]="'primary'" [loading]="isLoading"
                [disabled]="loginForm.invalid || isLoading" [fullWidth]="true" [size]="'lg'">
                {{ (isLoading ? 'ADMIN_LOGIN.LOADING' : 'ADMIN_LOGIN.BUTTON_LOGIN') | translate }}
            </app-button>

            <!-- Footer -->
            <div class="admin-login-footer">
                <a routerLink="/login" class="admin-login-back">
                    <i class="fas fa-arrow-left"></i>
                    {{ 'ADMIN_LOGIN.BACK_TO_USER' | translate }}
                </a>
            </div>
        </form>
    </div>
</div>
