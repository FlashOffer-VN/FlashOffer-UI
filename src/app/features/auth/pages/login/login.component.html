<!-- src/app/features/auth/pages/login/login.component.html -->
<div class="login-container">
    <div class="login-card">
        <!-- Decorative -->
        <div class="login-deco login-deco-1"></div>
        <div class="login-deco login-deco-2"></div>

        <!-- Header -->
        <div class="login-header">
            <div class="login-icon-wrapper">
                <i class="fas fa-user"></i>
            </div>
            <h1>{{ 'LOGIN.TITLE' | translate }}</h1>
            <p>{{ 'LOGIN.SUBTITLE' | translate }}</p>
        </div>

        <!-- Form -->
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
            <!-- Username -->
            <app-input formControlName="username" [label]="'LOGIN.USERNAME' | translate"
                [placeholder]="'LOGIN.USERNAME_PLACEHOLDER' | translate" [required]="true"
                [isInvalid]="isFieldInvalid('username')" [errorMessage]="getErrorMessage('username')"
                icon="fas fa-user">
            </app-input>

            <!-- Password -->
            <app-input formControlName="password" [type]="showPassword ? 'text' : 'password'"
                [label]="'LOGIN.PASSWORD' | translate" [placeholder]="'LOGIN.PASSWORD_PLACEHOLDER' | translate"
                [required]="true" [isInvalid]="isFieldInvalid('password')" [errorMessage]="getErrorMessage('password')"
                icon="fas fa-lock">
                <button type="button" (click)="togglePasswordVisibility()" class="login-password-toggle"
                    [attr.aria-label]="(showPassword ? 'Hide password' : 'Show password')">
                    <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                </button>
            </app-input>

            <!-- Options -->
            <div class="login-options">
                <label class="login-remember">
                    <input formControlName="rememberMe" type="checkbox">
                    <span>{{ 'LOGIN.REMEMBER_ME' | translate }}</span>
                </label>
                <a routerLink="/forgot-password" class="login-forgot">
                    {{ 'LOGIN.FORGOT_PASSWORD' | translate }}
                </a>
            </div>

            <!-- Submit -->
            <app-button type="submit" [variant]="'primary'" [loading]="isLoading"
                [disabled]="loginForm.invalid || isLoading" [fullWidth]="true" [size]="'lg'">
                {{ (isLoading ? 'LOGIN.LOADING' : 'LOGIN.BUTTON') | translate }}
            </app-button>

            <!-- Register Link -->
            <div class="login-footer">
                <span>{{ 'LOGIN.NO_ACCOUNT' | translate }}</span>
                <a routerLink="/register">{{ 'LOGIN.REGISTER' | translate }}</a>
            </div>

            <!-- Admin Login -->
            <div class="login-admin-link">
                <a routerLink="/admin-login">
                    <i class="fas fa-shield-alt"></i>
                    {{ 'LOGIN.ADMIN_LOGIN' | translate }}
                </a>
            </div>
        </form>
    </div>
</div>
