<div class="contact-floating-wrap">
    <!-- Nút gọi điện -->
    <a class="contact-floating-btn" [href]="'tel:' + phone" [attr.aria-label]="'Gọi điện ' + phoneDisplay"
        [title]="'Gọi ' + phoneDisplay">
        <i class="fa-solid fa-phone"></i>
    </a>

    <!-- Nút email -->
    <a class="contact-floating-btn" [href]="'mailto:' + email" aria-label="Gửi email" [title]="'Email: ' + email">
        <i class="fa-solid fa-envelope"></i>
    </a>

    <!-- Nút scroll-to-top - NHÚNG TRỰC TIẾP VÀO ĐÂY -->
    <button class="contact-floating-btn scroll-top-btn" [class.visible]="isVisible" (click)="scrollToTop()"
        aria-label="Scroll to top">
        <svg class="scroll-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </button>
</div>
