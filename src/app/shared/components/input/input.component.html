<!-- shared/components/input/input.component.html -->
<div class="app-input">
    <!-- Label -->
    @if (label) {
    <label [for]="id" class="app-input__label">
        {{ label }}
        @if (required) {
        <span class="app-input__required">*</span>
        }
    </label>
    }

    <!-- Input wrapper -->
    <div class="app-input__wrapper">
        @if (icon) {
        <i [class]="icon" class="app-input__icon"></i>
        }
        <input [id]="id" [type]="type" [placeholder]="placeholder" [readonly]="readonly"
            [disabled]="disabled || isDisabled" [value]="value" (input)="onInput($event)" (blur)="onBlur()"
            class="app-input__control" [class.has-icon]="icon" [class.is-invalid]="isInvalid"
            [class.is-disabled]="disabled || isDisabled" [class.is-readonly]="readonly" />
    </div>

    <!-- Hint -->
    @if (hint && !isInvalid) {
    <small class="app-input__hint">{{ hint }}</small>
    }

    <!-- Error -->
    @if (isInvalid && errorMessage) {
    <small class="app-input__error">{{ errorMessage }}</small>
    }
</div>
