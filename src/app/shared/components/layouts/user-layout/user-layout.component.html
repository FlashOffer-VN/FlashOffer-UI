<!-- shared/components/layouts/user-layout/user-layout.component.html -->
<div class="flex h-screen bg-gray-50">
    <!-- Sidebar -->
    <app-user-sidebar [isOpen]="isSidebarOpen" (toggle)="toggleSidebar()">
    </app-user-sidebar>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0">
        <!-- Header -->
        <app-user-header [logoPath]="logoPath" (toggleSidebar)="toggleSidebar()">
        </app-user-header>

        <!-- Page Content -->
        <main class="flex-1 p-6 overflow-y-auto">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
