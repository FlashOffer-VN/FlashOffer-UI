<!-- shared/components/layouts/user-layout/user-header/user-header.component.html -->
<header class="bg-white shadow-sm px-6 py-4 flex items-center justify-between">
    <!-- Left -->
    <div class="flex items-center gap-4">
        <button (click)="onToggleSidebar()" class="text-secondary hover:text-primary transition text-xl">
            <i class="fa-solid fa-bars"></i>
        </button>

        <a routerLink="/" class="flex items-center gap-2">
            <img [src]="logoPath" alt="Kindi" class="h-10 w-auto">
        </a>
    </div>

    <!-- Right -->
    <div class="flex items-center gap-3">
        <app-language-switcher></app-language-switcher>

        <div class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center text-sm font-medium">
            {{ userInitial }}
        </div>
        <span class="text-secondary text-sm hidden sm:block">{{ userName }}</span>
    </div>
</header>
