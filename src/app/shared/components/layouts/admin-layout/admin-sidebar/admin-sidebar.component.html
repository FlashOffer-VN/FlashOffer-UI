<!-- shared/components/layouts/admin-layout/admin-sidebar/admin-sidebar.component.html -->
<aside
    class="bg-secondary text-white w-64 flex-shrink-0 transition-all duration-300 overflow-y-auto flex flex-col h-full"
    [class.-ml-64]="!isOpen">

    <!-- Logo -->
    <div class="p-4 border-b border-secondary-light flex-shrink-0 relative">
        <a routerLink="/" class="flex items-center justify-center">
            <img src="logo-white.svg" alt="Kindi" class="h-8">
        </a>
        <p class="text-gray-400 text-sm mt-1 text-center">{{ 'ADMIN.SIDEBAR.PANEL' | translate }}</p>
        <!-- Nút đóng cho ngăn kéo trên mobile (≥1024px sidebar luôn hiện nên ẩn nút này) -->
        <button type="button" (click)="toggleSidebar()" [attr.aria-label]="'COMMON.BUTTON.CLOSE' | translate"
            class="app-drawer-close absolute top-3 right-3 flex items-center justify-center rounded-full text-gray-300 hover:bg-secondary-light hover:text-white transition lg:hidden">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <!-- Menu - flex-1 để đẩy logout xuống dưới -->
    <nav class="p-4 space-y-1 flex-1 overflow-y-auto">
        @for (group of visibleMenuGroups; track group.key) {
        @if (group.key) {
        <button type="button" (click)="toggleGroup(group.key)"
            class="flex w-full items-center justify-between gap-2 rounded-lg px-4 py-3 text-xs font-semibold uppercase tracking-wider text-gray-400 hover:text-gray-100 transition">
            <span>{{ group.key | translate }}</span>
            <i class="fa-solid text-[10px]" [ngClass]="isGroupExpanded(group.key) ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
        </button>
        }
        @if (!group.key || isGroupExpanded(group.key)) {
        @for (item of group.items; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="bg-primary"
            [routerLinkActiveOptions]="{ exact: item.path === '/' }"
            class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-secondary-light transition">
            <i [class]="item.icon" class="w-5"></i>
            {{ item.label | translate }}
        </a>
        }
        }
        }
    </nav>

    <!-- Logout - ở cuối sidebar -->
    <div class="p-4 border-t border-secondary-light flex-shrink-0">
        <button (click)="logout()"
            class="flex items-center gap-3 px-4 py-3 rounded-lg text-red-400 hover:bg-red-500/10 hover:text-red-300 transition w-full">
            <i class="fa-solid fa-right-from-bracket w-5"></i>
            <span>{{ 'ADMIN.SIDEBAR.LOGOUT' | translate }}</span>
        </button>
    </div>
</aside>
