<!-- shared/components/layouts/admin-layout/admin-layout.component.html -->
<div class="flex h-screen bg-gray-50">
    <!-- Sidebar -->
    <app-admin-sidebar [isOpen]="isSidebarOpen" (toggle)="toggleSidebar()">
    </app-admin-sidebar>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0">
        <!-- Header -->
        <app-admin-header [logoPath]="logoPath" (toggleSidebar)="toggleSidebar()">
        </app-admin-header>

        <!-- Page Content -->
        <main class="flex-1 p-6 overflow-y-auto">
            <router-outlet></router-outlet>
        </main>

        <!-- Footer -->
        <app-admin-footer></app-admin-footer>
    </div>
</div>
