<!-- shared/components/layouts/admin-layout/admin-layout.component.html -->
<div class="flex h-screen bg-gray-50">
    <!-- Sidebar -->
    <app-admin-sidebar [isOpen]="isSidebarOpen" (toggle)="toggleSidebar()">
    </app-admin-sidebar>

    <!-- Lớp phủ trên màn hình nhỏ: chạm ra ngoài để đóng sidebar -->
    <div *ngIf="isSidebarOpen" (click)="toggleSidebar()" class="app-drawer-backdrop fixed inset-0 bg-black/40 lg:hidden"
        aria-hidden="true"></div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0">
        <!-- Header -->
        <app-admin-header (toggleSidebar)="toggleSidebar()">
        </app-admin-header>

        <!-- Page Content -->
        <main class="flex-1 p-6 overflow-y-auto">
            <router-outlet></router-outlet>
        </main>

        <!-- Footer -->
        <app-admin-footer></app-admin-footer>
    </div>
</div>
