<header class="sme-header">
    <a class="sme-logo" routerLink="/home">
        <span class="logo-text">{{ 'APP_NAME' | translate }}</span>
        <span class="logo-dot"></span>
    </a>
    <nav class="sme-nav">
        <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
            {{ 'NAV_SOLUTIONS' | translate }}
        </a>
        <a routerLink="/suppliers" routerLinkActive="active">
            {{ 'NAV_SUPPLIERS' | translate }}
        </a>
        <a routerLink="/talent" routerLinkActive="active">
            {{ 'NAV_TALENT' | translate }}
        </a>
        <a routerLink="/community" routerLinkActive="active">
            {{ 'NAV_COMMUNITY' | translate }}
        </a>
    </nav>
    <div class="sme-header-actions">
        <!-- Language Switcher -->
        <app-language-switcher></app-language-switcher>

        <!-- ✅ Secret Admin Button -->
        <a *ngIf="showAdminButton" (click)="goToAdmin()"
            class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors cursor-pointer text-sm font-medium">
            {{ 'BUTTON_ADMIN' | translate }}
        </a>
        <a class="sme-button sme-button--ghost" routerLink="/register-ctv">{{ 'BUTTON_JOIN_CTV' | translate }}</a>
        <a class="sme-button sme-button--primary" routerLink="/connect-sme">{{ 'BUTTON_JOIN_SME' | translate }}</a>
    </div>
</header>
