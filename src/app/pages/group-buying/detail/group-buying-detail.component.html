<main class="min-h-screen bg-gradient-to-br from-slate-50 via-white to-violet-50 px-4 py-8">
    <div class="mx-auto max-w-4xl">
        <a routerLink="/social"
            class="mb-4 inline-flex items-center text-sm font-semibold text-primary hover:text-secondary">
            <i class="fas fa-arrow-left mr-2"></i>{{ 'GROUP_BUYING.TITLE' | translate }}
        </a>

        <!-- Mã chia sẻ trên link (?ref=) được truyền vào để ghi nhận cho người đã chia sẻ khi khách tham gia -->
        <app-group-buying-detail-modal [visible]="true" [embedded]="true" [requestCode]="code"
            [referralCodeFromUrl]="referralCode">
        </app-group-buying-detail-modal>
    </div>
</main>
