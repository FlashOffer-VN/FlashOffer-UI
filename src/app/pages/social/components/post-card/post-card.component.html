<div class="post-card">
    <div class="post-header">
        <div class="post-author">
            <img [src]="post.author.avatar | avatar" [alt]="post.author.fullName" class="author-avatar">
            <div class="author-info">
                <div class="author-name">
                    {{ post.author.fullName }}
                    <i *ngIf="post.author.isVerified" class="fas fa-check-circle verified"></i>
                </div>
                <div class="author-role">{{ post.author.role }}</div>
                <div class="post-time">{{ timeAgo }}</div>
            </div>
        </div>

        <div class="post-actions" *ngIf="canEdit || canDelete">
            <button class="actions-toggle" (click)="showActions = !showActions">
                <i class="fas fa-ellipsis-v"></i>
            </button>
            <div class="actions-dropdown" *ngIf="showActions">
                <button *ngIf="canEdit" class="action-item" (click)="edit.emit(post)">
                    <i class="fas fa-pen"></i> {{ 'COMMON.BUTTON.EDIT' | translate }}
                </button>
                <button *ngIf="canDelete" class="action-item danger" (click)="delete.emit(post)">
                    <i class="fas fa-trash"></i> {{ 'COMMON.BUTTON.DELETE' | translate }}
                </button>
            </div>
        </div>
    </div>

    <div class="post-content">
        <h3 *ngIf="post.title" class="post-title">{{ post.title }}</h3>
        <p class="post-text" [class.expanded]="post.isExpanded">
            {{ post.content }}
        </p>
        <button *ngIf="post.content.length > 200" class="read-more" (click)="toggleReadMore.emit(post)">
            {{ post.isExpanded ? ('SOCIAL.COLLAPSE' | translate) : ('SOCIAL.READ_MORE' | translate) }}
        </button>

        <div class="post-tags" *ngIf="post.tags.length">
            <span *ngFor="let tag of post.tags" class="tag">#{{ tag }}</span>
        </div>
    </div>

    <div class="post-actions-bar">
        <button class="action-btn" (click)="like.emit(post)">
            <i class="fas fa-heart" [class.liked]="post.isLiked"></i>
            <span>{{ post.likesCount }}</span>
        </button>
        <button class="action-btn" (click)="share.emit(post)">
            <i class="fas fa-share"></i>
            <span>{{ post.sharesCount }}</span>
        </button>
        <button class="action-btn" (click)="save.emit(post)">
            <i class="fas fa-bookmark" [class.saved]="post.isSaved"></i>
        </button>
    </div>
</div>
