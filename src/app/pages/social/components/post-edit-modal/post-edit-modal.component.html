<!-- Modal sửa bài viết — dùng chung cho bảng tin và trang Bài viết của tôi -->
@if (post) {
<div class="modal-overlay" [style.--modal-level]="modalLevel" (click)="close()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <h3>{{ 'SOCIAL.EDIT_POST' | translate }}</h3>
            <button class="modal-close" (click)="close()">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="modal-body">
            <!-- Title -->
            <div class="form-group">
                <label>{{ 'SOCIAL.POST_TITLE' | translate }}</label>
                <app-input [(ngModel)]="formData.title" placeholder="{{ 'SOCIAL.POST_TITLE' | translate }}" />
            </div>

            <!-- Content - Dùng Quill Editor với ngIf để force re-render -->
            <div class="form-group">
                <label>{{ 'SOCIAL.CONTENT' | translate }}</label>
                <quill-editor *ngIf="showQuillEditor" [(ngModel)]="formData.content" [modules]="editorConfig"
                    (onEditorCreated)="onEditorCreated($event)" class="edit-post-editor" placeholder="{{ 'SOCIAL.WHATS_NEW' | translate }}">
                </quill-editor>
            </div>

            <!-- Post Type -->
            <div class="form-group">
                <label>{{ 'SOCIAL.TYPE' | translate }}</label>
                <div class="options-buttons">
                    <button type="button" *ngFor="let type of postTypes" class="option-btn"
                        [class.active]="formData.type === type.value" (click)="selectType(type.value)">
                        <i [class]="'fas ' + type.icon"></i>
                        {{ type.label | translate }}
                    </button>
                </div>
            </div>

            <!-- Privacy -->
            <div class="form-group">
                <label>{{ 'SOCIAL.PRIVACY' | translate }}</label>
                <div class="options-buttons">
                    <button type="button" *ngFor="let privacy of privacyOptions" class="option-btn privacy-btn"
                        [class.active]="formData.privacy === privacy.value"
                        (click)="selectPrivacy(privacy.value)">
                        <i [class]="'fas ' + privacy.icon"></i>
                        {{ privacy.label | translate }}
                    </button>
                </div>
            </div>

            <!-- Tags -->
            <div class="form-group">
                <label>{{ 'SOCIAL.TAGS' | translate }}</label>
                <input type="text" [(ngModel)]="tagInput" (keyup.enter)="addTag()" class="form-control"
                    placeholder="{{ 'SOCIAL.ADD_TAG' | translate }}">
                <div class="tag-list">
                    <span *ngFor="let tag of formData.tags; let i = index" class="tag-item">
                        #{{ tag }}
                        <i class="fas fa-times" (click)="removeTag(i)"></i>
                    </span>
                </div>
            </div>
        </div>

        <div class="modal-footer">
            <div class="modal-footer-left">
                <span class="privacy-info">
                    <i [class]="'fas ' + getPrivacyIcon(formData.privacy || 1)"></i>
                    {{ getPrivacyLabel(formData.privacy || 1) | translate }}
                </span>
                <span class="type-info">
                    <i class="fas fa-file-alt"></i>
                    {{ getTypeLabel(formData.type || 1) | translate }}
                </span>
            </div>
            <div class="modal-footer-right">
                <button class="btn btn-secondary" (click)="close()">
                    {{ 'COMMON.BUTTON.CANCEL' | translate }}
                </button>
                <button class="btn btn-primary" (click)="save()" [disabled]="isSaving">
                    <i class="fas fa-spinner fa-spin" *ngIf="isSaving"></i>
                    {{ 'COMMON.BUTTON.SAVE' | translate }}
                </button>
            </div>
        </div>
    </div>
</div>
}
