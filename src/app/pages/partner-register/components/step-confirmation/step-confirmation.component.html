<!-- step-confirmation/step-confirmation.component.html -->
<div class="partner-step-content" [formGroup]="formGroup">
    <h2 class="step-title">{{ 'PARTNER.STEP_3_TITLE' | translate }}</h2>
    <p class="step-desc">{{ 'PARTNER.STEP_3_DESC' | translate }}</p>

    <!-- Summary -->
    <app-partner-summary [formData]="formGroup.value"></app-partner-summary>

    <!-- Terms -->
    <div class="form-group terms-group">
        <label class="checkbox-label">
            <input type="checkbox" formControlName="agreeTerms">
            <span>
                {{ 'PARTNER.AGREE_TERMS' | translate }}
                <a routerLink="/terms" target="_blank" rel="noopener" class="terms-link">
                    {{ 'PARTNER.TERMS_LINK' | translate }}
                </a>
            </span>
        </label>
        @if (isFieldInvalid('agreeTerms')) {
        <span class="error-text">{{ getErrorMessage('agreeTerms') }}</span>
        }
    </div>
</div>
