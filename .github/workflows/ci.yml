name: CI - FlashOffer UI

on:
  push:
    branches:
      - production
      - testing
  pull_request:
    branches:
      - production
      - testing

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Lint
      run: npm run lint || echo "No lint script found"

    - name: Run tests
      run: npm run test:ci || echo "No test script found"

    - name: Build project
      run: npm run build

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: flashoffer-ui-build-${{ github.ref_name }}
        path: dist/